name: Import complete ST7306 firmware
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-full-project.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-full-project:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the 4.2-inch repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Import the pinned 2.9-inch baseline and restore the ST7306 overlay
        env:
          SOURCE_COMMIT: f55ecc1042811ab410458be7223f19d4d9a5391e
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE"
          source_dir="$RUNNER_TEMP/source_29"
          saved="$RUNNER_TEMP/st7306_overlay"
          mkdir -p "$saved"
          overlay_files=(
            "AGENTS.md"
            "README.md"
            "CH584_V1_0_1/APP/include/yuying_TFT.h"
            "CH584_V1_0_1/APP/yuying_TFT.c"
            "CH584_V1_0_1/APP/Usart3_task.c"
            "CH584_V1_0_1/u8g2/u8x8_d_st7305.c"
            "CH584_V1_0_1/u8g2/u8g2_d_memory.c"
            "CH584_V1_0_1/tools/ST7306_42_BRINGUP.md"
            "tools/prepare_st7306.ps1"
          )
          for p in "${overlay_files[@]}"; do
            test -f "$root/$p"
            mkdir -p "$saved/$(dirname "$p")"
            cp -p "$root/$p" "$saved/$p"
          done
          git clone --quiet https://github.com/vasicambree-png/2.9-.git "$source_dir"
          git -C "$source_dir" checkout --quiet --detach "$SOURCE_COMMIT"
          test -s "$source_dir/CH584_V1_0_1/LIB/libCH58xBLE.a"
          test -s "$source_dir/CH584_V1_0_1/u8g2/u8g2_fonts.c"
          rsync -a --exclude='.git/' --exclude='.github/' "$source_dir/" "$root/"
          for p in "${overlay_files[@]}"; do
            cp -p "$saved/$p" "$root/$p"
            cmp "$saved/$p" "$root/$p"
          done
          printf '\n.work_st7306/\n' >> "$root/.gitignore"
          test -s "$root/CH584_V1_0_1/CH584M_TFT_HB.wvproj"
          test -s "$root/CH584_V1_0_1/LIB/libCH58xBLE.a"
          test -s "$root/CH584_V1_0_1/LIB/libISP585.a" || test -s "$root/CH584_V1_0_1/LIB/libCH58xBLE_PERI.a"
          test -s "$root/CH584_V1_0_1/u8g2/u8g2_fonts.c"
          grep -q '#define SCREEN_PANEL_ST7306_42 1' "$root/CH584_V1_0_1/APP/include/yuying_TFT.h"
          grep -q 'u8g2_Setup_st7306_300x400_f' "$root/CH584_V1_0_1/APP/yuying_TFT.c"
          git status --short

      - name: Commit full firmware to the 4.2-inch repository only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo "No import changes."
          else
            git commit -m "feat: complete 4.2-inch CH58x firmware with SDK and ST7306 overlay"
            git push origin HEAD:main
          fi
