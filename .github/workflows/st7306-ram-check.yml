name: ST7306 low-RAM source checks

on:
  push:
    branches:
      - opt/st7306-page-buffer-ram
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-and-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify expected 3KB page profile is selected
        shell: bash
        run: |
          set -euo pipefail
          grep -q '#define SCREEN_ST7306_PAGE_BUFFER 1' CH584_V1_0_1/APP/include/yuying_TFT.h
          grep -q 'static uint8_t buf\[75u \* 5u \* 8u\]' CH584_V1_0_1/u8g2/u8g2_d_memory.c
          grep -q 'u8g2_FirstPage(&u8g2)' CH584_V1_0_1/APP/yuying_TFT.c
          grep -q 'u8g2_NextPage(&u8g2)' CH584_V1_0_1/APP/yuying_TFT.c
          echo "Screen framebuffer profile: 75*5*8=3000 bytes vs 30000-byte full buffer."
      - name: Compile-time syntax check of changed modules
        shell: bash
        run: |
          set -euo pipefail
          p=CH584_V1_0_1
          includes=(-I"$p/APP" -I"$p/APP/include" -I"$p/HAL" -I"$p/HAL/include"
                    -I"$p/LIB" -I"$p/StdPeriphDriver/inc" -I"$p/RVMSIS"
                    -I"$p/u8g2/include")
          gcc -std=gnu99 -fsyntax-only "${includes[@]}" "$p/u8g2/u8g2_d_memory.c"
          gcc -std=gnu99 -fsyntax-only "${includes[@]}" "$p/u8g2/u8g2_d_setup.c"
          gcc -std=gnu99 -fsyntax-only "${includes[@]}" "$p/APP/yuying_TFT.c"

      - name: Compare page and full framebuffer BSS with GCC section GC
        shell: bash
        run: |
          set -euo pipefail
          p=CH584_V1_0_1
          gcc -std=gnu99 -O0 -ffunction-sections -fdata-sections \
              -I"$p/u8g2/include" -c "$p/u8g2/u8g2_d_memory.c" -o /tmp/st7306_memory.o
          cat > /tmp/st7306_ram_probe.c <<'EOF'
          #include <stdint.h>
          extern uint8_t *u8g2_m_75_50_p5(uint8_t *);
          extern uint8_t *u8g2_m_38_50_f(uint8_t *);
          int main(void)
          {
              uint8_t rows = 0;
          #if PAGE_BUFFER
              volatile uint8_t *buffer = u8g2_m_75_50_p5(&rows);
              buffer[0] = 1;
              return rows != 5;
          #else
              volatile uint8_t *buffer = u8g2_m_38_50_f(&rows);
              buffer[0] = 1;
              return rows != 50;
          #endif
          }
          EOF
          gcc -std=gnu99 -O0 -DPAGE_BUFFER=1 -ffunction-sections -fdata-sections \
              -Wl,--gc-sections /tmp/st7306_ram_probe.c /tmp/st7306_memory.o -o /tmp/page_framebuffer
          gcc -std=gnu99 -O0 -DPAGE_BUFFER=0 -ffunction-sections -fdata-sections \
              -Wl,--gc-sections /tmp/st7306_ram_probe.c /tmp/st7306_memory.o -o /tmp/full_framebuffer
          /tmp/page_framebuffer
          /tmp/full_framebuffer
          size /tmp/page_framebuffer /tmp/full_framebuffer
          page_bss=$(size -B /tmp/page_framebuffer | awk 'NR==2{print $3}')
          full_bss=$(size -B /tmp/full_framebuffer | awk 'NR==2{print $3}')
          diff=$((full_bss-page_bss))
          echo "Full minus page linked BSS = ${diff} bytes"
          test "$diff" -eq 27000
